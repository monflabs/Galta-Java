<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Galta</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Galta - JSON library and GaltaJS JavaScript engine for the JVM">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Dark/light theme with a switcher: https://github.com/boopathikumar018/docsify-darklight-theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/style.min.css" title="docsify-darklight-theme" type="text/css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Galta',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      // One sidebar for the whole site: avoid a 404 lookup in every sub-folder
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      // The browser's preference wins; this is the fallback, and the reader's choice is remembered
      darklightTheme: {
        defaultTheme: 'light'
      },
      search: {
        paths: 'auto',
        placeholder: 'Search',
        depth: 3
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/index.min.js" type="text/javascript"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
