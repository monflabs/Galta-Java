<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Playground</title>
    <!-- CheerpJ runs the playground's Java (Swing) application in the browser.
         Keep the loader version in sync with
         galta/parent-java/playground-java-cheerpj/cheerpj/index.html and docs/playground/index.html. -->
    <script src="https://cjrtnc.leaningtech.com/20260907_3546/loader.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #bar {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        padding: 4px 10px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.85);
        border-bottom-left-radius: 6px;
      }
      #loading {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        color: #555;
      }
      #cheerpj {
        width: 100vw;
        height: 100vh;
      }
      /* The mode of the documentation site (see the script below) */
      body.dark {
        background: #1e1e1e;
        color: #ccc;
      }
      body.dark #bar {
        background: rgba(40, 40, 40, 0.85);
      }
      body.dark #bar a {
        color: #8ab4f8;
      }
      body.dark #loading {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div id="bar"><a href="../">Galta documentation</a></div>
    <div id="loading">Loading the Java playground (a Java application running in your browser)...</div>
    <div id="cheerpj"></div>
    <script>
      // The mode the documentation site shows: the reader's choice (stored by the
      // docsify-darklight-theme plugin), else the system preference, else light
      function siteTheme() {
        let theme = null;
        try {
          theme = localStorage.getItem("DARK_LIGHT_THEME");
        } catch (e) {
          // Storage not available: the system preference
        }
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        return theme;
      }
      const theme = siteTheme();
      document.body.classList.toggle("dark", theme === "dark");

      (async function () {
        // CheerpJ maps "/app/" to the ROOT of this web server, not to the folder of
        // this page. The site is served at / locally but under /Galta-Java/ on
        // GitHub Pages, so the jar URL is built from this page's own path.
        const dir = location.pathname.replace(/[^/]*$/, "");
        const jar = "/app" + dir + "javaplayground-cheerpj.jar";
        try {
          const pageTitle = document.title;
          await cheerpjInit({
            version: 21,
            natives: {
              // JavaPlaygroundCheerpJ.showInUrl: the snippet shown is in the URL, to bookmark or share
              async Java_playground_JavaPlaygroundCheerpJ_showInUrl(lib, name, title) {
                const params = new URLSearchParams(location.search);
                params.set("snippet", name);
                // a name is made of [a-z0-9-] and slashes, which stay readable
                const query = params.toString().replace(/%2F/g, "/");
                history.replaceState(null, "", location.pathname + "?" + query + location.hash);
                document.title = pageTitle + " - " + title.replace(/`/g, "");
              },
            },
          });
          cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpj"));
          document.getElementById("loading").remove();
          // The playground starts in the same mode, on the snippet named in the URL
          // (?snippet=getting-started/hello-galta), else as before
          const args = ["--theme=" + theme];
          const snippet = new URLSearchParams(location.search).get("snippet");
          if (snippet) {
            args.push("--snippet=" + snippet);
          }
          await cheerpjRunMain("playground.JavaPlaygroundCheerpJ", jar, ...args);
        } catch (e) {
          document.getElementById("loading").textContent =
            "The playground could not be started: " + e;
        }
      })();
    </script>
  </body>
</html>
