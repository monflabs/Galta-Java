    <script>
      (async function () {
        await cheerpjInit({
          version: 17
        });
        cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpj"));
        await cheerpjRunMain(
          "playground.GaltaJSPlaygroundCheerpJ",
          "/app/jsplayground-cheerpj.jar"
        );
      })();
