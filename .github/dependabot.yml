# Weekly pull requests for new dependency and plugin versions.
#
# Every version lives in tools/monflabs-parent/pom.xml (third-party libraries in
# dependencyManagement, plugins in pluginManagement), so updates land there.
# Minor and patch updates are grouped into one pull request; major updates come
# one by one, since they may need code changes.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Galta's own artifacts are versioned by this repository
      - dependency-name: "org.monflabs.galta*"
      # Surefire 3.6+ runs JUnit 4 through the JUnit Platform and does not
      # pick up the JUnit 3 style suite() classes: wait for a JUnit 5 migration
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        versions: [">=3.6.0"]
